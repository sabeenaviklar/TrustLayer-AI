name: TrustLayer CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-ai-service:
    name: AI Service Tests (FastAPI & NLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest httpx

      - name: Run Pytest Pipeline Suite
        run: |
          cd ai-service
          pytest tests/ -v

  build-server:
    name: Backend API Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Compile TypeScript
        run: |
          cd server
          npm run build

  build-client:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Next.js App
        run: |
          cd client
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
